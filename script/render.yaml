# Repository root is WEB_GAME; choose script/render.yaml as Blueprint Path.
services:
  - type: web
    name: kao-battle
    runtime: python
    plan: free
    rootDir: script
    buildCommand: python -m compileall -q .
    startCommand: python -u server.py --cloud
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JUDGE_MODE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
